# Server 1: Main server on port 8080
server {
    listen 8080;
    server_name localhost example.com www.example.com;
    client_max_body_size 1M;

    error_page 404 /var/www/errors/404_custom.html;
    error_page 500 /var/www/errors/500_custom.html;

    location / {
        root /var/www;
        index index.html;
        allow_methods GET POST;
    }

    location /files {
        root /var/www/files;
        autoindex on;
        allow_methods GET POST;
    }

    location /example.com {
        root /var/www/example.com;
        index index.html;
        allow_methods GET POST;
    }

    location /YoupiBanane {
        root /var/www/YoupiBanane;
        index index.html;
        allow_methods GET POST;
    }

    location /uploads {
        root /var/www/uploads;
        allow_methods POST DELETE;
    }

    location /delete {
        root /tests/test_www/delete;
        allow_methods DELETE;
    }

    location /cgi-bin/ {
        cgi on;
        root /var/www/cgi-bin;
        allow_methods GET POST;
    }

    location /redirect/ {
        root /var/www/empty;
        redirect 301 /files/cat-css/cat.html;
    }

    location /forbidden {
        root /var/www/empty;
        allow_methods POST;
    }
}

# Server 2: API server on port 8081
server {
    listen 8081;
    server_name api.example.com www.api.example.com localhost;

    location / {
        root /var/www;
        index index.html;
        allow_methods GET POST;
    }

    location /status {
        root /var/www/files;
        index index.html;
        allow_methods GET;
    }

    location /cgi-bin/ {
        cgi on;
        root /var/www/cgi-bin;
        allow_methods GET POST;
    }
}

# Server 3: Test server on port 8082
server {
    listen 8082;
    server_name test.com www.test.com localhost;

    location / {
        root /var/www/example.com;
        index index.html;
        allow_methods GET POST;
    }

    location /protected {
        root /var/www/YoupiBanane;
        allow_methods GET;
    }

    location /upload {
        root /var/www/uploads;
        allow_methods POST;
    }
} 