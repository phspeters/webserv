# Example Web Server Configuration (.conf)
# Ref: https://nginx.org/en/docs/beginners_guide.html

server {
    listen 8090;
    server_name localhost blog.com www.blog.com example.com;
    client_max_body_size 1G;

    error_page 404 /var/www/errors/404_custom.html;
    error_page 500 /var/www/errors/500_custom.html;

    location / {
        root /var/www;
        index index.html;
        allow_methods GET POST;
    }

    location /uploads {
        root /var/www;
        allow_methods POST DELETE;
    }

    location /autoindex {
        root /var/www;
        autoindex on;
        allow_methods GET POST;
    }

    location /cgi-bin/ {
       cgi on;
       root /var/www;
       allow_methods GET POST;
    }

    location /redirect/ {
        root /var/www;
        redirect 301 /files/cat-css/cat.html;
    }

    location /forbidden {
        root /var/www;
        allow_methods GET POST;
    }  

    location /readonly {
        root /tmp;
        allow_methods POST;
    }
}

