# Virtual hosting: Two servers on the same port (8090), different server_names
server {
    listen 8092;
    server_name site-one.example.com;
    location / {
        root /var/www;
        allow_methods GET;
    }
}

server {
    listen 8092;
    server_name site-two.example.com;
    location / {
        root /var/www;
        allow_methods GET;
    }
    location /upload {
        root /var/www/uploads;
        allow_methods GET POST;
    }
} 