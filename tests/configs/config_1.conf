#
# config_1.conf: A standard, valid configuration file.
#
# This file represents a standard, valid configuration with multiple common features enabled. 
# Your parser should accept this file without any errors.
#
server {
    listen 8080;
    server_name example.com www.example.com;
    client_max_body_size 8M;

    error_page 404 /error_pages/404.html;
    error_page 500 /error_pages/500.html;

    # Default location for serving static files
    location / {
        root /var/www/html;
        index index.html index.htm;
        allow_methods GET;
        autoindex on;
    }

    # Location for handling file uploads
    location /upload/ {
        root /var/www/uploads;
        allow_methods POST;
        autoindex off;
    }

    # Location for CGI scripts
    location /cgi-bin/ {
        root /var/www/cgi-bin;
        allow_methods GET POST;
        cgi on;
    }

    # Location for a permanent redirect
    location /old-page {
        redirect 301 http://example.com/new-page;
        root /var/www/html;
    }
}