#
# config_3.conf: Tests edge cases and complex valid scenarios.
#
# Server 1: The default server for port 8000
#
# This file tests more complex but valid scenarios, 
# such as multiple server blocks on the same port (virtual hosting), tricky spacing, and comments. 
# It should be accepted as a valid configuration.
#
server {
    listen      8000;
    server_name site-one.com;

    location / {
        root /var/www/site-one;
        index index.html;
        allow_methods GET;
        autoindex off;
    }
}

# Server 2: A second server on the same port, demonstrating virtual hosting
server {
    listen 8000;
    server_name site-two.com www.site-two.com; # Multiple server names

    location / {
        root /var/www/site-two;
        index main.html;
        allow_methods GET POST;
    }

    # A more specific location match
    location /images/ {
        root /var/www/site-two/assets;
        autoindex on;
    }
}


# Server 3: A different server on a different port
server{
    listen 8088;
    server_name localhost;
    client_max_body_size 0; # Special case: Disallow any body

    location / {
        root /var/www/local;
    }
}