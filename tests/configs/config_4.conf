#
# config_4.conf: Advanced and edge-case configuration tests.
#
# This file tests complex valid scenarios and specific error conditions
# related to virtual hosting and directive placement.
#

# --- VALID CONFIGURATIONS ---

# Test 1 & 2: Two servers on the same port (8090), different server_names.
# This is a standard virtual hosting setup. The first one becomes the default.
server {
    listen 8090;
    server_name site-one.example.com;
    location / {
        root /var/www/site-one;
        allow_methods GET;
    }
}

server {
    listen 8090;
    server_name site-two.example.com;
    location / {
        root /var/www/site-two;
        allow_methods GET;
    }
}

# Test 3: Wildcard host vs. specific IP on the same port (8091).
# A request to 127.0.0.1:8091 should match the second server.

