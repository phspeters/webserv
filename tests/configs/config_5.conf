#
# config_5.conf: "Kitchen Sink" - A complex but valid configuration.
# Tests multiple listen directives, default servers, and location-specific overrides.
#

# Server A: The main server, demonstrating multiple features.
server {
    # This server listens on two different addresses for the same port.
    listen 127.0.0.1:8100;
    listen 8101;

    server_name complex.example.com;
    client_max_body_size 1M; # Default for this server

    error_page 404 /errors/custom_404.html;

    # Default location for static content
    location / {
        root /var/www/complex_site;
        index home.html;
        allow_methods GET;
        autoindex on;
    }

    # Location for uploads with a specific, larger body size limit.
    location /upload/form {
        root /var/www/uploads;
        allow_methods POST;
        client_max_body_size 20M; # Override server default
        autoindex off;
    }

    # Location for CGI scripts
    location /cgi/ {
        root /var/www/cgi-scripts;
        allow_methods GET POST;
        cgi on;
    }

    # A simple redirect
    location /legacy {
        redirect 302 /new-home;
    }
}

# Server B: A simple default server for port 8200.
# With no server_name, it should handle any request to port 8200
# that doesn't match another server block on that port.
server {
    listen 8200;

    location / {
        root /var/www/default_server;
        allow_methods GET;
        index index.html;
    }
}