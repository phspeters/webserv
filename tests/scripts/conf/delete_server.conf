# =============================================================================
# WEBSERV DELETE HANDLER TEST CONFIGURATION
# =============================================================================
# This configuration is for testing the FileDeleteHandler. It listens on port
# 8080 and defines a specific location for handling DELETE requests.
# =============================================================================

server {
    listen 8080;
    server_name example.com;

    # Location for handling DELETE requests.
    # A request to /delete/some_file.txt will map to
    # tests/test_www/delete/some_file.txt on the filesystem,
    # according to the 'root' directive's behavior.
    location / {
        root tests/test_www;
        allow_methods DELETE;
    }

    location /delete/ {
        root tests/test_www;
        allow_methods DELETE;
    }
}