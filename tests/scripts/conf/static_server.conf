# =============================================================================
# WEBSERV TEST CONFIGURATION
# =============================================================================
# This configuration is specifically designed for the 'run_static_handler_tests.sh'
# script. It sets up the server to listen on the correct port and defines
# the necessary locations to test all features like root, index, autoindex,
# redirects, and allowed methods.
# =============================================================================

server {
    listen 8090;
    server_name example.com;

    # Default location for most static file tests.
    # It points to the root directory created by the test script.
    location / {
        root tests/test_www/static_test_root;
        index index.html;
        allow_methods GET;
        autoindex on; # 'on' by default for the main tests
    }

    location /blogs {
        root tests/test_www/static_test_root;
        index index.html;
        allow_methods GET;
    }

    # Specific location to test a directory where autoindex is explicitly OFF
    # and no index file exists. This is required for Test 2.5.
    location /autoindex_off_no_index/ {
        root tests/test_www/static_test_root;
        allow_methods GET;
        autoindex off;
    }

    # Specific location to test a 301 redirect.
    # This is required for Test 4.1.
    location /old-page.html {
        root tests/test_www/static_test_root;
        redirect 301 /new-page.html;
    }

    location /blogs {
        root tests/test_www/static_test_root;
        allow_methods GET;
        autoindex off;
    }
}