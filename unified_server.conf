# Unified Web Server Configuration
# Combines all features from multi_server.conf and server.conf for comprehensive testing

# Main Server: Handles static, uploads, CGI, redirects, errors, and more
server {
    listen 8090;
    server_name localhost blog.com www.blog.com example.com api.example.com www.api.example.com test.com www.test.com;
    client_max_body_size 1G;

    error_page 404 /var/www/errors/404_custom.html;
    error_page 500 /var/www/errors/500_custom.html;

    # Root static files
    location / {
        root /var/www;
        index index.html;
        allow_methods GET POST;
    }

    # File uploads
    location /uploads {
        root /var/www;
        allow_methods POST DELETE;
    }

    # Autoindex directory
    location /autoindex {
        root /var/www;
        autoindex on;
        allow_methods GET POST;
    }

    # Static files with autoindex
    location /files {
        root /var/www/files;
        autoindex on;
        allow_methods GET POST;
    }

    # Example.com static site
    location /example.com {
        root /var/www/example.com;
        index index.html;
        allow_methods GET POST;
    }

    # YoupiBanane static site
    location /YoupiBanane {
        root /var/www/YoupiBanane;
        index index.html;
        allow_methods GET POST;
    }

    # Delete handler for test files
    location /delete {
        root /tests/test_www;
        allow_methods DELETE;
    }

    # CGI handler
    location /cgi-bin/ {
        cgi on;
        root /var/www;
        allow_methods GET POST;
    }

    # Redirect example
    location /redirect/ {
        root /var/www/empty;
        redirect 301 /files/cat-css/cat.html;
    }

    # Forbidden example
    location /forbidden {
        root /var/www/empty;
        allow_methods POST;
    }

    # Readonly directory for upload permission test
    location /readonly {
        root /tmp;
        allow_methods POST;
    }

    # Status endpoint for API
    location /status {
        root /var/www/files;
        index index.html;
        allow_methods GET;
    }
}

# Test server for /protected and /upload
server {
    listen 8082;
    server_name test.com www.test.com localhost;

    location / {
        root /var/www/example.com;
        index index.html;
        allow_methods GET POST;
    }

    location /protected {
        root /var/www/YoupiBanane;
        allow_methods GET;
    }

    location /upload {
        root /var/www/uploads;
        allow_methods POST;
    }
} 