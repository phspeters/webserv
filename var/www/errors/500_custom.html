<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 8rem;
            font-weight: 700;
            color: #e9ecef;
            margin: 0;
            text-shadow: -1px -1px 0 #adb5bd, 1px -1px 0 #adb5bd, -1px 1px 0 #adb5bd, 1px 1px 0 #adb5bd;
        }
        h2 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #dc3545;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: #6c757d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s ease-in-out;
        }
        a:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Oops! Something went wrong on our end. We have been notified and are working to fix the problem.</p>
        <a href="/">Return to Homepage</a>
    </div>
</body>
</html>
